 <style>
 .container{
    display: flex;
    justify-content: center;
    flex-wrap: wrap;   
 }   

.content1{
    width: 40%;
   background-color: white;}
 
   
.content2{
  width: 60%;  
}

.content2 p{
    font-size: clamp(18px, 1.3vw, 25px);
    text-align: center;
}

.content2 h1{
    font-size: clamp(36px, 4vw, 60px);
    line-height: 1.05;
} 

.content2 h2{
    font-size: clamp(22px, 2.5vw, 34px);
    text-align: center;
}

.image-main{
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
}

.image{
    width: clamp(45px, 5vw, 60px);
    height: clamp(45px, 5vw, 60px);
    border-radius: 100px;
    margin: 7px;
    background-color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background-color 0.25s ease, transform 0.25s ease;
    font-size: 24px;
    border: 1px solid #1d4ed8;
}

.image:hover {
    background-color: #3b82f6;
    transform: translateY(-2px);
}

.image a {
    color: #1d4ed8;
    font-size: 1.1rem;
    text-decoration: none;
}

.image:hover a {
    color: white;
}

.image img{
    width: 70%;
    height: 70%;
    object-fit: contain;
}

.button{
    display: flex;
    justify-content: center;
}

.content1 img {
    width: 100%;
    max-width: 520px;
    height: auto;
}

@media screen and (max-width: 900px) {
  .container {
    flex-direction: column;
    align-items: center;
  }

  .content1,
  .content2 {
    width: 100%;
  }

  .content1 img {
    width: 100%;
    max-width: 520px;
    margin-top: 20px;
  }

  .content2 {
    padding: 0 1.25rem;
  }

  .content2 h1 {
    font-size: 32px;
  }

  .content2 h2 {
    font-size: 24px;
  }

  .content2 p {
    font-size: 16px;
  }

  .image {
    width: clamp(40px, 7vw, 52px);
    height: clamp(40px, 7vw, 52px);
  }

  .image a {
    font-size: 1rem;
  }

  .button button {
    width: 100%;
    max-width: 320px;
  }
}

 </style>
